version: '3.8'

services:
  forgepilot:
    image: forgepilot:latest
    container_name: forgepilot
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      # API Keys — set via .env on NAS or via ForgePilot Settings UI
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - LINEAR_TEAM_ID=${LINEAR_TEAM_ID:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_OWNER=${GITHUB_OWNER:-Jokerbitt}
      - GITHUB_REPOSITORIES=${GITHUB_REPOSITORIES:-forgepilot}
      - NODE_ENV=production
    volumes:
      # Persistent data: api-keys, project-briefs, running-processes
      - forgepilot-config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  forgepilot-config:
    driver: local
