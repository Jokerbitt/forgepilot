name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Stub-Werte damit Build nicht wegen fehlender Env-Vars scheitert
          ANTHROPIC_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: 1

      - name: Coverage report
        run: npm run test:coverage
        continue-on-error: true   # coverage darf fehlschlagen ohne CI zu blocken
        env:
          CI: true

      - name: Upload coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## 📊 Test Coverage" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (x) => x.pct.toFixed(1) + '%';
              console.log('| Metric | Coverage |');
              console.log('|---|---|');
              console.log('| Lines | ' + pct(s.lines) + ' |');
              console.log('| Functions | ' + pct(s.functions) + ' |');
              console.log('| Branches | ' + pct(s.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi
