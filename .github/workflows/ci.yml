name: CI

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: ['20', '22']
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: vitest
        run: npm run test:run 2>&1 | tee /tmp/test-output.txt
        continue-on-error: true

      - name: Fail if tests failed
        if: steps.vitest.outcome == 'failure'
        run: |
          echo "Tests failed on Node ${{ matrix.node-version }}"
          exit 1

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Production build
        if: matrix.node-version == '22'
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ANTHROPIC_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: 1

      - name: Coverage report
        if: matrix.node-version == '22'
        run: npm run test:coverage
        continue-on-error: true
        env:
          CI: true

      - name: Upload coverage summary
        if: matrix.node-version == '22' && always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "## Test Coverage (Node ${{ matrix.node-version }})" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              const pct = (x) => x.pct.toFixed(1) + '%';
              console.log('| Metric | Coverage |');
              console.log('|---|---|');
              console.log('| Lines | ' + pct(s.lines) + ' |');
              console.log('| Functions | ' + pct(s.functions) + ' |');
              console.log('| Branches | ' + pct(s.branches) + ' |');
            " >> $GITHUB_STEP_SUMMARY
          fi

  test-report:
    name: Post Test Report
    runs-on: ubuntu-latest
    needs: test
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - name: Post test summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- forgepilot-test-report -->';
            const existing = comments.find(c => c.body.includes(marker));

            const testJob = '${{ needs.test.result }}';
            const icon = testJob === 'success' ? 'PASS' : 'FAIL';
            const body = [
              marker,
              '## CI Test Report - ' + icon,
              '',
              '**Result:** ' + testJob,
              '**Node versions tested:** 20, 22',
              '**Triggered by:** `${{ github.event.pull_request.head.sha }}`',
              '',
              testJob === 'success'
                ? '> All matrix legs passed. Safe to merge.'
                : '> One or more matrix legs failed. Check the Actions tab for details.',
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
