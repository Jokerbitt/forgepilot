name: 🔍 Static Analysis Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  static-analysis:
    name: Static Analysis Review
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Collect diff stats
        id: stats
        run: |
          FILES=$(git diff --name-only origin/main...HEAD | grep -E '\.(ts|tsx)$' | wc -l | tr -d ' ')
          NEW_TESTS=$(git diff origin/main...HEAD -- 'src/**/*.test.*' | grep '^+' | grep -v '^+++' | wc -l | tr -d ' ')
          echo "changed_files=$FILES" >> $GITHUB_OUTPUT
          echo "new_test_lines=$NEW_TESTS" >> $GITHUB_OUTPUT

      - name: ESLint check
        id: eslint
        run: |
          set +e
          npx eslint src --ext .ts,.tsx --max-warnings 0 --report-unused-disable-directives 2>&1 | tee /tmp/eslint_output.txt
          ESLINT_EXIT=$?
          set -e
          ESLINT_WARNINGS=$(grep -c 'warning' /tmp/eslint_output.txt || true)
          ESLINT_ERRORS=$(grep -c 'error' /tmp/eslint_output.txt || true)
          echo "eslint_exit=$ESLINT_EXIT" >> $GITHUB_OUTPUT
          echo "eslint_warnings=$ESLINT_WARNINGS" >> $GITHUB_OUTPUT
          echo "eslint_errors=$ESLINT_ERRORS" >> $GITHUB_OUTPUT
          if [ $ESLINT_EXIT -ne 0 ]; then
            echo "ESLINT_STATUS=❌ Failed ($ESLINT_ERRORS errors, $ESLINT_WARNINGS warnings)" >> $GITHUB_ENV
          else
            echo "ESLINT_STATUS=✅ Passed (0 warnings, 0 errors)" >> $GITHUB_ENV
          fi

      - name: TypeScript strict check
        id: typecheck
        run: |
          set +e
          npm run type-check 2>&1 | tee /tmp/tsc_output.txt
          TSC_EXIT=$?
          set -e
          TSC_ERRORS=$(grep -c 'error TS' /tmp/tsc_output.txt || true)
          echo "tsc_exit=$TSC_EXIT" >> $GITHUB_OUTPUT
          echo "tsc_errors=$TSC_ERRORS" >> $GITHUB_OUTPUT
          if [ $TSC_EXIT -ne 0 ]; then
            echo "TSC_STATUS=❌ Failed ($TSC_ERRORS errors)" >> $GITHUB_ENV
          else
            echo "TSC_STATUS=✅ Passed (0 errors)" >> $GITHUB_ENV
          fi

      - name: Test coverage summary
        id: tests
        run: |
          set +e
          npx vitest run --reporter=verbose 2>&1 | tee /tmp/vitest_output.txt
          VITEST_EXIT=$?
          set -e
          TESTS_PASSED=$(grep -E 'Tests\s+[0-9]+ passed' /tmp/vitest_output.txt | grep -oE '[0-9]+ passed' | head -1 || echo "0 passed")
          TESTS_FAILED=$(grep -E 'Tests\s+.*failed' /tmp/vitest_output.txt | grep -oE '[0-9]+ failed' | head -1 || echo "")
          echo "tests_exit=$VITEST_EXIT" >> $GITHUB_OUTPUT
          echo "tests_passed=$TESTS_PASSED" >> $GITHUB_OUTPUT
          if [ $VITEST_EXIT -ne 0 ]; then
            echo "TEST_STATUS=❌ Failed — $TESTS_FAILED" >> $GITHUB_ENV
          else
            echo "TEST_STATUS=✅ $TESTS_PASSED" >> $GITHUB_ENV
          fi

      - name: Post PR comment
        uses: actions/github-script@v9
        env:
          ESLINT_STATUS: ${{ env.ESLINT_STATUS }}
          TSC_STATUS: ${{ env.TSC_STATUS }}
          TEST_STATUS: ${{ env.TEST_STATUS }}
          CHANGED_FILES: ${{ steps.stats.outputs.changed_files }}
          NEW_TEST_LINES: ${{ steps.stats.outputs.new_test_lines }}
        with:
          script: |
            const eslintStatus = process.env.ESLINT_STATUS;
            const tscStatus = process.env.TSC_STATUS;
            const testStatus = process.env.TEST_STATUS;
            const changedFiles = process.env.CHANGED_FILES;
            const newTestLines = process.env.NEW_TEST_LINES;

            const allGreen = !eslintStatus.startsWith('❌') && !tscStatus.startsWith('❌') && !testStatus.startsWith('❌');
            const overallBadge = allGreen ? '✅ All checks passed' : '❌ Some checks failed';

            const body = `## 🔍 Static Analysis Review\n\n${overallBadge}\n\n| Check | Status |\n|---|---|\n| ESLint | ${eslintStatus} |\n| TypeScript | ${tscStatus} |\n| Tests | ${testStatus} |\n\n**PR Stats:** ${changedFiles} TypeScript files changed · ${newTestLines} new test lines added\n\n---\n*Static analysis via ESLint + tsc + Vitest — no AI credits required*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if checks failed
        if: steps.eslint.outputs.eslint_exit != '0' || steps.typecheck.outputs.tsc_exit != '0' || steps.tests.outputs.tests_exit != '0'
        run: |
          echo "One or more static analysis checks failed."
          exit 1
