name: Performance Budget

on:
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ANTHROPIC_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: 1

      - name: Check bundle budget
        # Limits live in config/bundle-budget.json so they can be tuned without
        # editing the workflow. Script is unit-tested (scripts/bundle-budget.test.mjs).
        run: |
          node scripts/bundle-budget.mjs --markdown >> $GITHUB_STEP_SUMMARY
          node scripts/bundle-budget.mjs

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Only run when Lighthouse CI is configured (LHCI_GITHUB_APP_TOKEN secret exists)
    # Without the token, this job is informational only (no upload)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ANTHROPIC_API_KEY: placeholder
          GOOGLE_API_KEY: placeholder
          SENTRY_SUPPRESS_GLOBAL_ERROR_HANDLER_FILE_WARNING: 1

      - name: Run Lighthouse CI
        run: lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        continue-on-error: true   # informational until budgets are tuned
