name: 🤖 Autonomous Daily Development

on:
  schedule:
    # Runs every day at 09:03 CET (08:03 UTC)
    - cron: '3 8 * * *'
  workflow_dispatch:
    inputs:
      task_override:
        description: 'Optional: override which task to work on (leave empty to auto-pick from BACKLOG.md)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write

# ─── Cost budget per run ──────────────────────────────────────────────────────
# Tier 1: Gemini 2.0 Flash  = $0.00  (free, 1500 req/day)
# Tier 2: Claude Haiku 4.5  = ~$0.04 (fallback for complex tasks)
# Tier 3: Claude Sonnet 4.5 = ~$0.40 (only if Haiku fails twice)
# ─────────────────────────────────────────────────────────────────────────────

jobs:
  autonomous-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests (baseline check)
        run: npm run test:run
        env:
          CI: true

      # ── Coordination: preflight + claim ──────────────────────────────────
      # Stops two GitHub-Action runs (or a local Sven session) from clobbering
      # each other. The agent works on its own isolated branch and claims a
      # scope before any edits. Branch sharing requires explicit opt-in.
      - name: Agent coordination — preflight + claim
        id: claim
        run: |
          AGENT_ID="autonomous-dev-${GITHUB_RUN_ID}"
          BRANCH="feature/auto-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"

          echo "AGENT_ID=$AGENT_ID"   >> "$GITHUB_ENV"
          echo "AGENT_BRANCH=$BRANCH" >> "$GITHUB_ENV"

          # Always preflight against the workspace the agent will edit.
          # Wide pattern is fine — concrete agents narrow it before claiming.
          node scripts/agent-coord.mjs preflight --files "src/**,scripts/**" \
            || echo "preflight returned non-zero, continuing — branch is fresh"

          node scripts/agent-coord.mjs claim \
            --agent "$AGENT_ID" \
            --type claude-code \
            --milestone "autonomous-dev-${{ github.run_id }}" \
            --branch "$BRANCH" \
            --files "src/**,scripts/**,BACKLOG.md" \
            --ttl 60

      # ── Pick task ─────────────────────────────────────────────────────────
      - name: Pick next task from BACKLOG.md
        id: pick-task
        run: |
          if [ -n "${{ github.event.inputs.task_override }}" ]; then
            TASK="${{ github.event.inputs.task_override }}"
          else
            TASK=$(grep -m1 '^\- \[ \]' BACKLOG.md | sed 's/^- \[ \] //')
          fi
          if [ -z "$TASK" ]; then
            echo "No more tasks in backlog!"
            echo "task=" >> $GITHUB_OUTPUT
          else
            echo "task=$TASK" >> $GITHUB_OUTPUT
            SLUG=$(echo "$TASK" | sed 's/feat: //;s/fix: //;s/chore: //' | tr '[:upper:]' '[:lower:]' | tr ' /(),' '-' | sed 's/[^a-z0-9-]//g' | cut -c1-30)
            echo "slug=$SLUG" >> $GITHUB_OUTPUT
          fi

      # ── Classify task complexity with Gemini ──────────────────────────────
      - name: Classify task complexity (Gemini Flash — free)
        id: classify
        if: steps.pick-task.outputs.task != ''
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          TASK="${{ steps.pick-task.outputs.task }}"

          # Ask Gemini Flash to classify complexity
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=$GOOGLE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"contents\": [{
                \"parts\": [{
                  \"text\": \"Classify this software task complexity. Reply with ONLY one word: SIMPLE or COMPLEX.\n\nSIMPLE = UI tweaks, adding a button/toggle, small API route, updating text, adding tests to existing code.\nCOMPLEX = new multi-file feature, architectural changes, database schema, authentication, real-time systems.\n\nTask: $TASK\"
                }]
              }],
              \"generationConfig\": { \"maxOutputTokens\": 5, \"temperature\": 0 }
            }" 2>/dev/null)

          COMPLEXITY=$(echo "$RESPONSE" | python3 -c "
          import json,sys
          try:
              d = json.load(sys.stdin)
              text = d['candidates'][0]['content']['parts'][0]['text'].strip().upper()
              print('simple' if 'SIMPLE' in text else 'complex')
          except:
              print('complex')  # safe fallback
          ")

          echo "complexity=$COMPLEXITY" >> $GITHUB_OUTPUT
          echo "📊 Task complexity: $COMPLEXITY (classified by Gemini Flash — $0)"

      # ── Tier 1: Gemini Flash — complexity hint for Haiku (free) ─────────
      # Note: Gemini generates a bash plan but Haiku often ignores it.
      # Keeping Gemini only for the complexity classification result above.
      # The "gemini-build" step is now a no-op placeholder to preserve step IDs.
      - name: Gemini hint (no-op — classification already done above)
        id: gemini-build
        if: steps.pick-task.outputs.task != ''
        run: |
          echo "gemini_plan=" >> $GITHUB_OUTPUT
          echo "attempted=false" >> $GITHUB_OUTPUT
          echo "ℹ️  Gemini used only for classification. Haiku builds directly."

      # ── Tier 2: Claude Haiku — primary executor (cheap, reliable) ─────────
      - name: Build feature — Claude Haiku 4.5 (~$0.04)
        id: claude-build
        if: steps.pick-task.outputs.task != ''
        uses: anthropics/claude-code-action@beta
        with:
          model: claude-haiku-4-5
          prompt: |
            You are working on the ForgePilot project (Next.js 14, TypeScript strict, Tailwind, Vitest).

            Your task: **${{ steps.pick-task.outputs.task }}**

            Task complexity: **${{ steps.classify.outputs.complexity }}** (classified by Gemini Flash)

            COST OPTIMIZATION — use the cheapest approach:
            - Prefer editing existing files over creating new ones
            - Keep implementations concise but complete
            - Do NOT add unnecessary abstractions or over-engineer

            COORDINATION — prevent merge conflicts:
            A scope claim has already been registered for this run:
              AGENT_ID  : ${{ env.AGENT_ID }}
              BRANCH    : ${{ env.AGENT_BRANCH }}
            Renew the lease while you work:
            ```bash
            npm run agent -- heartbeat --agent "${{ env.AGENT_ID }}"
            ```
            See who else is live:
            ```bash
            npm run agent:status
            ```

            FORBIDDEN — do NOT edit (merge conflict risk):
            - config/*.json  (runtime state, not in git)
            - .env.local
            - BACKLOG.md  ← NEVER touch — CI marks it done after merge automatically
            - package.json / package-lock.json  ← no npm installs; use existing deps only
            - src/app/settings/providers/page.tsx  (conflict-prone)

            BRANCH — use the pre-claimed dedicated branch (never touch main):
            ```bash
            git checkout -b "${{ env.AGENT_BRANCH }}" origin/main
            ```

            Steps:
            1. Create the branch (as above)
            2. Implement feature — use ONLY existing npm packages (no npm install)
            3. `npm run type-check` — fix ALL errors
            4. `npm run test:run` — ALL tests pass + add ≥3 new tests
            5. Do NOT touch BACKLOG.md — the pipeline marks it done after merge
            6. Before each `git commit`: validate scope
               ```bash
               AGENT_ID="${{ env.AGENT_ID }}" bash scripts/pre-commit-scope-check.sh
               ```
            7. Commit + push + `gh pr create` (ok if gh not authenticated — push is enough)

            Quality: TypeScript strict, no `any`, dark theme slate colors, no hardcoded secrets.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: 'Bash,Read,Write,Edit'

      # ── Quality Gate ──────────────────────────────────────────────────────
      - name: Quality gate — type-check + tests + security scan
        id: quality-gate
        if: steps.pick-task.outputs.task != ''
        run: |
          set -e
          echo "🔍 Quality Gate..."

          BRANCH=$(git branch --show-current)
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

          npm run type-check
          echo "type_check=pass" >> $GITHUB_OUTPUT

          NEXT_TELEMETRY_DISABLED=1 ANTHROPIC_API_KEY=placeholder GOOGLE_API_KEY=placeholder npm run build 2>&1 | tail -5
          echo "build=pass" >> $GITHUB_OUTPUT

          npm run test:run
          TEST_RESULT=$(npm run test:run 2>&1 | grep 'Tests ' | tail -1)
          echo "test_result=$TEST_RESULT" >> $GITHUB_OUTPUT
          echo "tests=pass" >> $GITHUB_OUTPUT

          # Security: no API keys
          if git diff origin/main...HEAD | grep -E "^\+" | grep -E "(sk-ant-api|AIzaSy[^A-Za-z]|tgp_v1_|ghp_[a-zA-Z]|lin_api_)" | grep -v "test\|example\|placeholder\|#" 2>/dev/null; then
            echo "❌ Possible API key in diff!"
            exit 1
          fi

          echo "✅ Quality Gate passed"
          echo "model_used=haiku-or-gemini" >> $GITHUB_OUTPUT

      # ── Self-healing: Claude Haiku fixes failures ──────────────────────────
      - name: Self-healing — fix failures (Claude Haiku)
        id: claude-fix
        if: failure() && steps.claude-build.outcome == 'success' && steps.quality-gate.outcome == 'failure'
        uses: anthropics/claude-code-action@beta
        with:
          model: claude-haiku-4-5
          prompt: |
            The quality gate failed. Fix ALL errors.

            Task: **${{ steps.pick-task.outputs.task }}**

            1. `npm run type-check` → read errors → fix each one
            2. `NEXT_TELEMETRY_DISABLED=1 ANTHROPIC_API_KEY=placeholder GOOGLE_API_KEY=placeholder npm run build` → fix build errors
            3. `npm run test:run` → read failures → fix each one
            4. Verify all pass
            5. `git commit -m "fix: resolve quality gate failures"` + push

            Rules: TypeScript strict, no `any`, no skipping tests.
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_tools: 'Bash,Read,Write,Edit'

      # ── Quality gate re-check ─────────────────────────────────────────────
      - name: Quality gate re-check (after self-healing)
        id: quality-gate-2
        if: steps.claude-fix.outcome == 'success'
        run: |
          npm run type-check && npm run test:run
          echo "tests=pass" >> $GITHUB_OUTPUT

      # ── Auto-merge ────────────────────────────────────────────────────────
      - name: Auto-merge PR
        if: |
          steps.pick-task.outputs.task != '' &&
          (steps.quality-gate.outputs.tests == 'pass' || steps.quality-gate-2.outputs.tests == 'pass')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(git branch --show-current)
          echo "🔀 Auto-merging branch: $BRANCH"

          # Wait for PR (up to 30s)
          for i in 1 2 3 4 5 6; do
            PR_URL=$(gh pr list --head "$BRANCH" --json url -q '.[0].url' 2>/dev/null || echo "")
            [ -n "$PR_URL" ] && break
            echo "Waiting for PR... ($i/6)"
            sleep 5
          done

          # Create PR if agent didn't (gh not authenticated in action context)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --title "feat(auto): ${{ steps.pick-task.outputs.task }}" \
              --body "🤖 Auto-built $(date '+%Y-%m-%d') | Model: Gemini Flash + Haiku | Quality gate: ✅" \
              --head "$BRANCH" --base main)
          fi

          # --auto: waits for all required CI checks to pass before merging
          gh pr merge "$PR_URL" --squash --auto \
            --body "🤖 Auto-merged: quality gate ✅ | Cost: ~\$0.00–\$0.04"
          echo "✅ Auto-merge queued: $PR_URL"

      # ── Mark BACKLOG done (after merge — zero conflict risk) ──────────────
      - name: Mark task done in BACKLOG.md
        if: |
          steps.pick-task.outputs.task != '' &&
          (steps.quality-gate.outputs.tests == 'pass' || steps.quality-gate-2.outputs.tests == 'pass')
        run: |
          git checkout main && git pull origin main --ff-only 2>/dev/null || true
          TASK="${{ steps.pick-task.outputs.task }}"
          python3 <<'PY'
          import os
          import pathlib

          pattern = os.environ["TASK"][:40].lower()
          p = pathlib.Path("BACKLOG.md")
          lines = p.read_text().splitlines(keepends=True)
          changed = 0

          for i, line in enumerate(lines):
              if line.startswith("- [ ]") and pattern[:28] in line.lower():
                  lines[i] = line.replace("- [ ]", "- [x]", 1)
                  changed += 1

          p.write_text("".join(lines))
          print(f"Marked {changed} item(s) done")
          PY
          git add BACKLOG.md
          git diff --cached --quiet || \
            git commit -m "chore(backlog): ✅ ${{ steps.pick-task.outputs.task }}" && \
            git push origin main

      # ── Failure alert ─────────────────────────────────────────────────────
      - name: Create issue on repeated failure
        if: failure() && steps.claude-fix.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "🤖 Autonomous agent failed: ${{ steps.pick-task.outputs.task }}" \
            --body "**Task:** ${{ steps.pick-task.outputs.task }}
          **Date:** $(date)
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Quality gate failed even after self-healing. Manual fix needed." \
            --label "bug" || true

      # ── Agent coordination cleanup ────────────────────────────────────────
      - name: Release agent scope claim
        if: always() && env.AGENT_ID != ''
        run: |
          node scripts/agent-coord.mjs release --agent "$AGENT_ID" || true

      # ── Cost report ───────────────────────────────────────────────────────
      - name: Cost report
        if: always()
        run: |
          COMPLEXITY="${{ steps.classify.outputs.complexity }}"
          if [ "$COMPLEXITY" = "simple" ]; then
            COST="~\$0.00 (Gemini Flash)"
          else
            COST="~\$0.04 (Claude Haiku)"
          fi

          echo "## 🤖 Autonomous Dev Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Date** | $(date '+%Y-%m-%d %H:%M CET') |" >> $GITHUB_STEP_SUMMARY
          echo "| **Task** | ${{ steps.pick-task.outputs.task }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Complexity** | $COMPLEXITY |" >> $GITHUB_STEP_SUMMARY
          echo "| **Estimated cost** | $COST |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build** | ${{ steps.claude-build.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Quality Gate** | ${{ steps.quality-gate.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Self-healing** | ${{ steps.claude-fix.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Tests** | ${{ steps.quality-gate.outputs.test_result }} |" >> $GITHUB_STEP_SUMMARY
