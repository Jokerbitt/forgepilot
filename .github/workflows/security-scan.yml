name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
      - name: Run CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
        continue-on-error: true

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Run npm audit (JSON Report)
        run: npm audit --json > audit-report.json || true
      - name: Upload audit report
        uses: actions/upload-artifact@v7
        with:
          name: npm-audit-report
          path: audit-report.json

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  claude-security-review:
    name: Claude Security Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Claude Security Analysis
        uses: anthropics/claude-code-action@beta
        continue-on-error: true
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          direct_prompt: |
            Fuehre ein Security Review dieses Pull Requests durch. Antworte auf Deutsch.

            Pruefe explizit auf:
            - SQL Injection, XSS, CSRF Schwachstellen
            - Hardcodierte Secrets oder API Keys
            - Unsichere Authentifizierung / Autorisierung
            - Unsichere Datenvalidierung
            - Exponierte sensible Daten in Logs
            - Unsichere Abhaengigkeiten

            Format: Kritisch / Hoch / Mittel / Info
            Nur echte Probleme melden, keine False Positives.