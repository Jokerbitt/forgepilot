version: 2
updates:
  # npm / Node.js packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
    open-pull-requests-limit: 5
    labels:
      - "tech-debt"
    commit-message:
      prefix: "chore"
    # One grouped PR for all non-major updates instead of one PR per package
    # (prevents the bump-flood). Major updates stay individual + ignored below.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "tech-debt"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns: ["*"]
